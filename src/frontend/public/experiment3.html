<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Experiment 3: Pattern Memory Challenge</title>

    <!-- jsPsych 7.3 from CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.min.js?v=2"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css?v=2" rel="stylesheet">

    <!-- jsPsych plugins -->
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.min.js?v=2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.2/dist/index.browser.min.js?v=2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey@0.2.1/dist/index.browser.min.js?v=2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.min.js?v=2"></script>

    <!-- API Client -->
    <script src="../assets/js/api-client.js?v=2"></script>

    <!-- Experiment Script - deferred to load after jsPsych -->
    <script src="../experiments/experiment3-pattern.js?v=2" defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .card-display {
            font-size: 120px;
            margin: 40px 0;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 200px;
            height: 280px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-back:hover {
            transform: scale(1.05);
        }
        .card-ace {
            color: #e74c3c;
            font-size: 120px;
        }
        .card-blank {
            color: #95a5a6;
            font-size: 100px;
        }

        /* Radio button styling for likert scales */
        input[type="radio"] {
            appearance: auto !important;
            -webkit-appearance: radio !important;
            -moz-appearance: radio !important;
            width: 15px !important;
            height: 15px !important;
            cursor: pointer !important;
            margin: 15px !important;
            display: inline-block !important;
            opacity: 1 !important;
            visibility: visible !important;
            position: relative !important;
            z-index: 1000 !important;
            border: 3px solid #333 !important;
            background: white !important;
            transform: scale(1.5) !important;
        }

        /* Override jsPsych survey plugin's visuallyhidden class */
        .sv_main .sv-visuallyhidden,
        .sv-visuallyhidden,
        .sv_main input[type="radio"].sv-visuallyhidden,
        input[type="radio"].sv-visuallyhidden {
            position: relative !important;
            height: 15px !important;
            width: 15px !important;
            overflow: visible !important;
            clip: auto !important;
            transform: scale(1.5) !important;
        }

        /* Likert scale container styling */
        .jspsych-survey-likert {
            margin: 20px 0;
        }

        .jspsych-survey-likert-opts {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 0 20px;
        }

        .jspsych-survey-likert-opts label {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 20px;
            min-width: 80px;
        }

        .jspsych-survey-likert-opts label:hover {
            background-color: #e8f4f8;
            border-radius: 12px;
        }

        .jspsych-survey-likert-opts input[type="radio"] {
            margin-bottom: 15px;
        }

        .jspsych-survey-likert-opts .likert-label {
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // Check for participant info from session
        const participantId = sessionStorage.getItem('participant_id');
        const condition = sessionStorage.getItem('condition');

        if (!participantId || !condition) {
            alert('Missing participant information. Please start from the beginning.');
            window.location.href = 'index.html';
        }

        // Start experiment when page loads
        window.addEventListener('DOMContentLoaded', function() {
            runPatternMemory(participantId, condition);
        });
    </script>
</body>
</html>
