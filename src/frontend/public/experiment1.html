<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 1: Digital Treasure Hunt</title>

    <!-- jsPsych 7.3 from CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.min.js?v=2"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css?v=2" rel="stylesheet">

    <!-- jsPsych plugins -->
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.min.js?v=2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey@0.2.1/dist/index.browser.min.js?v=2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.min.js?v=2"></script>

    <!-- API Client -->
    <script src="../assets/js/api-client.js?v=2"></script>

    <!-- Experiment Script -->
    <script src="../experiments/experiment1-treasure.js?v=2" defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // Check for participant info from session
        const participantId = sessionStorage.getItem('participant_id');
        const condition = sessionStorage.getItem('condition');

        if (!participantId || !condition) {
            alert('Missing participant information. Please start from the beginning.');
            window.location.href = 'index.html';
        }

        // Start experiment when page loads
        window.addEventListener('DOMContentLoaded', function() {
            runTreasureHunt(participantId, condition);
        });
    </script>
</body>
</html>
