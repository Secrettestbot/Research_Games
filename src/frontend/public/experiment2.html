<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 2: Career Choice Study</title>

    <!-- jsPsych 7.3 from CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">

    <!-- jsPsych plugins -->
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey@0.2.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>

    <!-- API Client -->
    <script src="../assets/js/api-client.js"></script>

    <!-- Experiment Script -->
    <script src="../experiments/experiment2-career.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .scenario-box {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
        }
        .slider-container {
            margin: 30px 0;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // Check for participant info from session
        const participantId = sessionStorage.getItem('participant_id');
        const condition = sessionStorage.getItem('condition');

        if (!participantId) {
            alert('Missing participant information. Please start from the beginning.');
            window.location.href = 'index.html';
        }

        // Start experiment when page loads
        window.addEventListener('DOMContentLoaded', function() {
            runCareerChoice(participantId);
        });
    </script>
</body>
</html>
