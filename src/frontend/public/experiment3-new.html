<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Experiment 3: Pattern Memory Challenge</title>

    <!-- jsPsych 7.3 from CDN -->
    <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.min.js?v=2"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css?v=2" rel="stylesheet">

    <!-- jsPsych plugins -->
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.min.js?v=2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey@0.2.1/dist/index.browser.min.js?v=2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.min.js?v=2"></script>

    <!-- API Client -->
    <script src="../assets/js/api-client.js?v=2"></script>

    <!-- Experiment Script - deferred to load after jsPsych -->
    <script src="../experiments/experiment3-pattern.js?v=3" defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .card-display {
            font-size: 120px;
            margin: 40px 0;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 200px;
            height: 280px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-back:hover {
            transform: scale(1.05);
        }
        .card-ace {
            color: #e74c3c;
            font-size: 120px;
        }
        .card-blank {
            color: #95a5a6;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        // Check for participant info from session
        const participantId = sessionStorage.getItem('participant_id');
        const condition = sessionStorage.getItem('condition');

        if (!participantId || !condition) {
            alert('Missing participant information. Please start from the beginning.');
            window.location.href = 'index.html';
        }

        // Start experiment when page loads
        window.addEventListener('DOMContentLoaded', function() {
            runPatternMemory(participantId, condition);
        });
    </script>
</body>
</html>
