<!DOCTYPE html>
<html>
<head>
    <title>Radio Button Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        label { display: block; margin: 10px 0; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Radio Button Test</h1>
    <p>If you can see and click these radio buttons, they work:</p>

    <label>
        <input type="radio" name="test" value="1" checked>
        Option 1
    </label>
    <label>
        <input type="radio" name="test" value="2">
        Option 2
    </label>
    <label>
        <input type="radio" name="test" value="3">
        Option 3
    </label>

    <button onclick="showSelected()">Show Selected</button>
    <p id="result"></p>

    <script>
        function showSelected() {
            const selected = document.querySelector('input[name="test"]:checked');
            document.getElementById('result').textContent = 'Selected: ' + selected.value;
        }
    </script>
</body>
</html>
